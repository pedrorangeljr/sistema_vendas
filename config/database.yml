
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  password: admin
  host: localhost

development:
  <<: *default
  database: sistema_vendas_development

 
test:
  <<: *default
  database: sistema_vendas_test


production:
  <<: *default
  database: sistema_vendas_production
  username: sistema_vendas
  password: <%= ENV["SISTEMA_VENDAS_DATABASE_PASSWORD"] %>
